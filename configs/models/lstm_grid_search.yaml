fixed:
  model: "lstm"
  epochs: 50
  patience: 5
  train_samples: 5000
  valid_samples: 1000
  test_samples: 1000
  checkpoint_dir: "checkpoints/models/lstm/grid_search_1/"

search_parameters:
  embedding_dim: [256, 128]
  hidden_dim: [512, 256]
  num_layers: [1, 2]
  learning_rate: [0.001, 0.0005]
  teacher_forcing_prob: [0.5, 1.0]